<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/app}">
<head>
    <title>Capital Additions | FAMS</title>
</head>
<body>
<div layout:fragment="content">
    <div class="bg-white rounded-xl p-6 border border-border-default shadow-sm mb-6">
        <h1 class="text-page-title text-nav-text">Capital Additions</h1>
        <p class="text-body-default text-secondary mt-2">Manage and record capital additions for assets.</p>
    </div>

    <!-- Feedback Messages -->
    <div th:if="${successMessage}" class="bg-status-success/10 border border-status-success text-status-success px-4 py-3 rounded-md mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span th:text="${successMessage}">Success message</span>
    </div>
    <div th:if="${errorMessage}" class="bg-error/10 border border-error text-error px-4 py-3 rounded-md mb-6 flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px]">error</span>
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Add Form -->
        <div class="lg:col-span-1">
            <div class="bg-white rounded-xl p-6 border border-border-default shadow-sm">
                <h2 class="text-section-header text-nav-text mb-4">Record Addition</h2>
                <form th:action="@{/assets/capital-additions}" method="post">
                    <div class="mb-4">
                        <label for="assetCode" class="block text-label-small text-secondary mb-1">Asset Code</label>
                        <input type="text" id="assetCode" name="assetCode" required class="w-full h-input-height px-3 rounded-md border border-border-default text-nav-text focus:border-primary focus:ring-1 focus:ring-primary outline-none text-[13px]">
                    </div>
                    <div class="mb-4">
                        <label for="date" class="block text-label-small text-secondary mb-1">Date</label>
                        <input type="date" id="date" name="date" required class="w-full h-input-height px-3 rounded-md border border-border-default text-nav-text focus:border-primary focus:ring-1 focus:ring-primary outline-none text-[13px]">
                    </div>
                    <div class="mb-4">
                        <label for="amount" class="block text-label-small text-secondary mb-1">Amount</label>
                        <input type="number" step="0.01" id="amount" name="amount" required class="w-full h-input-height px-3 rounded-md border border-border-default text-nav-text focus:border-primary focus:ring-1 focus:ring-primary outline-none text-[13px]">
                    </div>
                    <div class="mb-4">
                        <label for="type" class="block text-label-small text-secondary mb-1">Addition Type</label>
                        <select id="type" name="type" required class="w-full h-input-height px-3 rounded-md border border-border-default text-nav-text focus:border-primary focus:ring-1 focus:ring-primary outline-none text-[13px]">
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}">Type</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label for="description" class="block text-label-small text-secondary mb-1">Description</label>
                        <textarea id="description" name="description" rows="3" class="w-full px-3 py-2 rounded-md border border-border-default text-nav-text focus:border-primary focus:ring-1 focus:ring-primary outline-none text-[13px] resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full h-button-height bg-primary text-white rounded-md font-medium hover:bg-brand-primary-dark transition-colors flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">save</span>
                        Save Addition
                    </button>
                </form>
            </div>
        </div>

        <!-- Additions List -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl border border-border-default shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-border-default bg-surface-canvas">
                    <h2 class="text-section-header text-nav-text">Recent Additions</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-surface-canvas border-b border-border-default">
                                <th class="px-6 py-3 text-label-small font-semibold text-secondary uppercase tracking-wider">Asset</th>
                                <th class="px-6 py-3 text-label-small font-semibold text-secondary uppercase tracking-wider">Date</th>
                                <th class="px-6 py-3 text-label-small font-semibold text-secondary uppercase tracking-wider">Type</th>
                                <th class="px-6 py-3 text-label-small font-semibold text-secondary uppercase tracking-wider text-right">Amount</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-border-default">
                            <tr th:if="${#lists.isEmpty(additions)}">
                                <td colspan="4" class="px-6 py-8 text-center text-secondary text-body-medium">
                                    No recent capital additions found.
                                </td>
                            </tr>
                            <tr th:each="add : ${additions}" class="hover:bg-surface-canvas transition-colors">
                                <td class="px-6 py-4">
                                    <div class="text-body-medium font-semibold text-nav-text" th:text="${add.asset.assetCode}">Code</div>
                                    <div class="text-label-small text-secondary" th:text="${add.asset.name}">Name</div>
                                </td>
                                <td class="px-6 py-4 text-body-medium text-nav-text" th:text="${#temporals.format(add.additionDate, 'MMM dd, yyyy')}">Date</td>
                                <td class="px-6 py-4 text-body-medium text-nav-text" th:text="${add.type}">Type</td>
                                <td class="px-6 py-4 text-body-medium text-nav-text font-technical-data text-right" th:text="${#numbers.formatCurrency(add.amount)}">Amount</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
