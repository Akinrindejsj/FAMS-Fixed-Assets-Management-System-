<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/app}">
<head>
    <title>Unexpected Error | FAMS</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="bg-white rounded-xl p-8 border border-border-default shadow-sm text-center max-w-2xl mx-auto mt-10">
            <span class="material-symbols-outlined text-[64px] text-error mb-4">error</span>
            <h1 class="text-page-title text-nav-text mb-2">Oops! Something went wrong.</h1>
            <p class="text-body-default text-secondary mb-6">
                We're sorry, but an unexpected error occurred while processing your request. 
            </p>
            
            <div class="bg-surface-canvas rounded-lg p-4 text-left border border-border-default mb-8">
                <div class="text-label-small text-secondary mb-1">Error Details:</div>
                <div class="text-body-medium text-error font-technical-data" th:text="${error != null ? error : 'Internal Server Error'}">Internal Server Error</div>
                <div class="text-label-small text-secondary mt-2 mb-1">Status Code:</div>
                <div class="text-body-medium font-technical-data" th:text="${status != null ? status : '500'}">500</div>
                <div class="text-label-small text-secondary mt-2 mb-1">Path:</div>
                <div class="text-body-medium font-technical-data" th:text="${path != null ? path : '/unknown'}">/unknown</div>
                <div th:if="${message != null && !message.isEmpty()}" class="mt-2">
                    <div class="text-label-small text-secondary mb-1">Message:</div>
                    <div class="text-body-medium font-technical-data" th:text="${message}">Error message</div>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <a href="#" onclick="window.history.back(); return false;" class="px-6 py-2 rounded-md border border-border-default text-nav-text font-medium hover:bg-surface-canvas transition-colors">
                    Go Back
                </a>
                <a th:href="@{/dashboard}" class="px-6 py-2 rounded-md bg-primary text-white font-medium hover:bg-brand-primary-dark transition-colors">
                    Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
